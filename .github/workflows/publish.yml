name: Publish

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy to package index
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Required for NuGet Trusted Publishing (OIDC)
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "6.x"

      - name: Package
        run: dotnet pack --configuration Release

      # Exchanges this job's OIDC token for a 1-hour nuget.org API key.
      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name of the publishing account

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" **/*.nupkg
